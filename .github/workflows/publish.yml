name: Publish Docker Image

on:
  push:
    branches: [master]
    tags:
      - "v*"

# Third-party actions are pinned to commit SHAs (this workflow holds
# contents:write and the Docker Hub secrets); the comment names the version.

# One publish at a time: two merges close together would otherwise both read
# the same latest tag and race on the patch bump.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Verify tag is on master
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::Tag must be on the master branch. Aborting publish."
            exit 1
          fi

      - name: Determine tags
        id: meta
        run: |
          REPO="${{ secrets.DOCKERHUB_USERNAME }}/litres_advanced_filters"

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # Explicit tag push (manual major/minor release)
            VERSION="${GITHUB_REF_NAME#v}"
          else
            # Master push without tag — auto-increment patch version
            LATEST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n1)
            if [[ -z "$LATEST_TAG" ]]; then
              VERSION="1.0.0"
            else
              # Parse major.minor.patch and bump patch
              BASE="${LATEST_TAG#v}"
              MAJOR=$(echo "$BASE" | cut -d. -f1)
              MINOR=$(echo "$BASE" | cut -d. -f2)
              PATCH=$(echo "$BASE" | cut -d. -f3)
              PATCH=$((PATCH + 1))
              VERSION="${MAJOR}.${MINOR}.${PATCH}"
            fi
            # The git tag is pushed only after the image was smoke-tested
            # and published (step "Push version tag").
            echo "push_tag=true" >> "$GITHUB_OUTPUT"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tags=${REPO}:${VERSION},${REPO}:latest" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Test what ships: build the image locally, start it on an empty volume
      # (entrypoint runs the migrations), and probe it over HTTP before pushing.
      - name: Build image for smoke test
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/app/Dockerfile
          load: true
          push: false
          tags: litres-smoke:ci
          cache-from: type=gha

      - name: Smoke test image
        run: |
          docker run -d --name smoke -e SECRET_KEY=ci-smoke-key -p 127.0.0.1:5000:5000 litres-smoke:ci
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5000/static/css/style.css >/dev/null \
               && curl -fsS http://127.0.0.1:5000/auth/status | grep -q '"authenticated":false'; then
              ok=1; break
            fi
            sleep 2
          done
          docker logs smoke
          docker rm -f smoke
          [ "$ok" = 1 ] || { echo "::error::Image smoke test failed"; exit 1; }

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/app/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push version tag
        if: steps.meta.outputs.push_tag == 'true'
        # GITHUB_TOKEN pushes don't trigger workflows (no infinite loop)
        run: |
          git tag "v${{ steps.meta.outputs.version }}"
          git push origin "v${{ steps.meta.outputs.version }}"
